  <text x="600" y="122" text-anchor="middle" font-family="'League Spartan', 'Arial Narrow', sans-serif" font-weight="600" font-size="46" fill="#E6F9E4" opacity="0.92" letter-spacing="1">PUBLIC MONEY. PUBLIC RECORD.</text>
  <text x="600" y="162" text-anchor="middle" font-family="'Avenir Next', Avenir, Mulish, sans-serif" font-weight="400" font-size="13" fill="#E6F9E4" opacity="0.60">Support the Pension Investment Integrity Act</text>
