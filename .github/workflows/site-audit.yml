name: Site accuracy and accessibility
on:
  pull_request:
  push:
    branches: [main, feat/astro-banknote-rebuild]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.txt
      - name: Check shared campaign copy
        run: python scripts/sync_campaign_content.py
      - name: Validate evidence, types, static output and assets
        run: npm run validate
      - name: Save the reviewed static candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arpensions-static-candidate
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
