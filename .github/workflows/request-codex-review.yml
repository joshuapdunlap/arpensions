name: Request Codex review

on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Codex to review the pull request
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_REQUEST_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set CODEX_REVIEW_REQUEST_TOKEN to a fine-grained token from a Codex-linked GitHub user, limited to this repository with Pull requests read and write."
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --body '@codex review'
