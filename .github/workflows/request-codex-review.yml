name: Review pull request in writing
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  written-review:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/written-codex-review.yml
    with:
      pull_number: ${{ github.event.pull_request.number }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
